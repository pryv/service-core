---

dnsLess:
  isActive: true

reporting:
  templateVersion: '1.0.0'

http:
  ip: '127.0.0.1'
  port: 3000


# Unified storage engine: 'mongodb' | 'sqlite' | 'postgresql'
# When set, overrides per-component keys (database:engine,
# storageUserAccount:engine, storageUserIndex:engine, storagePlatform:engine).
# When absent, falls back to per-component keys for backward compatibility.
# storageEngine: 'mongodb'

database:
  engine: 'mongodb' # legacy per-component key; prefer storageEngine
  authUser: ''
  authPassword: ''
  host: '127.0.0.1'
  port: 27017
  name: 'pryv-node'
  connectTimeoutMS: 60000
  socketTimeoutMS: 60000

postgresql:
  host: '127.0.0.1'
  port: 5432
  database: 'pryv-node'
  user: 'pryv'
  password: ''
  max: 20

userFiles:
  path: 'REPLACE ME'

eventFiles:
  attachmentsDirPath: 'REPLACE ME'
  previewsDirPath: 'REPLACE ME'

auth:
  filesReadTokenSecret: 'REPLACE ME'
  passwordComplexityMinCharCategories: 0
  passwordComplexityMinLength: 0
  passwordAgeMaxDays: 0
  passwordAgeMinDays: 0
  passwordPreventReuseHistoryLength: 0

customExtensions:
  defaultFolder: 'REPLACE ME'
  customAuthStepFn: ''

testNotifications:
  enabled: false

updates:
  ignoreProtectedFields: false

influxdb:
  host: 127.0.0.1
  port: 8086

webhooks:
  minIntervalMs: 5000
  maxRetries: 5
  runsSize: 20

versioning:
  forceKeepHistory: false
  deletionMode: 'keep-nothing'

user-account:
  delete: # array of entities that can delete a user account
    - 'adminToken' # enable deletion from admin Panel
    #- 'personalToken' # enable self deletion request with a personal token

custom:
  systemStreams:
    account:
    - id: email
      isIndexed: true
      isUnique: true
      isShown: true
      isEditable: true
      type: email/string
      name: Email
      isRequiredInValidation: true
  dataStores: []

caching:
  isActive: true

logs:
  console:
    active: false
    level: info
  file:
    active: false
    path: "var-pryv/logs/core.log"
    level: info
    rotation:
      isActive: true
      days: 14

uploads:
  maxSizeMb: 50

trace:
  enable: false

integrity:
  isActive:
    attachments: true
    events: true
    accesses: true
  algorithm: sha256

accessTracking:
  isActive: true

cluster:
  apiWorkers: 2
  hfsWorkers: 1
  previewsWorker: true
  runMigrations: true
